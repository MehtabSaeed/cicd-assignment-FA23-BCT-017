<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CI/CD Assignment - FA23-BCT-017</title>
</head>
<body>
  <h1 id="main-heading">CI/CD Assignment BROKEN</h1>
  <p id="student-name">Name: Mehtab Saeed</p>
  <p id="roll-number">Roll Number: FA23-BCT-017</p>

  <button id="greet-btn">Click me</button>
  <p id="greet-message"></p>

  <input type="text" id="text-input" placeholder="Type something">
  <button id="submit-btn">Submit</button>
  <p id="output"></p>

  <script>
    document.getElementById('greet-btn').addEventListener('click', function () {
      document.getElementById('greet-message').textContent = 'Hello from Mehtab Saeed!';
    });
    document.getElementById('submit-btn').addEventListener('click', function () {
      var value = document.getElementById('text-input').value;
      document.getElementById('output').textContent = 'You entered: ' + value;
    });
  </script>
</body>
</html>
